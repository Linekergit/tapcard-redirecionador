<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapCard | Painel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="caixa">
    <h1 class="logo">
      <span class="t">T</span><span class="a">A</span><span class="p">P</span><span class="card">CARD</span>
    </h1>
    <p class="frase">APROXIMOU • CONECTOU</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">

      <button type="submit" id="botao">Entrar</button>
      <p id="mensagem" class="mensagem"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
